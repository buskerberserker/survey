<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>투자·자산관리 경험 조사</title><meta name="description" content="개인의 금융자산 관리 및 투자 행태에 관한 학술연구 설문이에요. 약 7~12분 소요."><meta name="robots" content="noindex,nofollow"><meta property="og:title" content="투자·자산관리 경험 조사"><meta property="og:description" content="개인의 금융자산 관리 및 투자 행태에 관한 학술연구 · 약 7~12분"><meta property="og:type" content="website"><meta name="theme-color" content="#ffffff"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; one question per screen, sticky bottom CTA, screens slide horizontally */
:root {
  --bg: #ffffff;
  --outer: #f2f4f6;
  --surface: #f6f7f9;
  --surface-press: #e8ebee;
  --fg: #191f28;
  --fg2: #4e5968;
  --fg3: #8b95a1;
  --line: #e5e8eb;
  --accent: #3182f6;
  --accent-press: #1b64da;
  --accent-soft: #e8f3ff;
  --accent-ink: #1b64da;
  --on-accent: #ffffff;
  --danger: #f04452;
  --toast: #333d4b;
  --toast-fg: #ffffff;
  --disabled: #d1d6db;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171c; --outer: #101013; --surface: #222229; --surface-press: #2c2c35;
    --fg: #f2f4f6; --fg2: #c3c8cf; --fg3: #7e8794; --line: #2c2c35;
    --accent: #3d8bfd; --accent-press: #2272eb; --accent-soft: rgba(61,139,253,.16); --accent-ink: #78aefc;
    --on-accent: #ffffff; --danger: #ff6370; --toast: #3a3a45; --toast-fg: #f2f4f6; --disabled: #3a3a45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17171c; --outer: #101013; --surface: #222229; --surface-press: #2c2c35;
  --fg: #f2f4f6; --fg2: #c3c8cf; --fg3: #7e8794; --line: #2c2c35;
  --accent: #3d8bfd; --accent-press: #2272eb; --accent-soft: rgba(61,139,253,.16); --accent-ink: #78aefc;
  --on-accent: #ffffff; --danger: #ff6370; --toast: #3a3a45; --toast-fg: #f2f4f6; --disabled: #3a3a45;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--outer); color: var(--fg);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto;
  background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
}
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line); } }

/* ---------- top bar ---------- */
.top {
  flex: 0 0 auto; height: 56px; display: flex; align-items: center; gap: 8px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative; z-index: 3; background: var(--bg);
}
.back {
  height: 40px; padding: 0 12px 0 4px; border-radius: 12px; display: flex; align-items: center; gap: 2px;
  font-size: 16px; font-weight: 600; color: var(--fg2); flex: 0 0 auto;
  transition: background .15s, transform .15s var(--ease), opacity .2s;
}
.back:active { background: var(--surface); transform: scale(.94); }
.back svg { width: 22px; height: 22px; stroke: var(--fg2); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.back[aria-hidden="true"] { opacity: 0; pointer-events: none; }
.bar { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; transition: opacity .3s; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .45s var(--ease); }
.bar.off { opacity: 0; }

/* ---------- stage & screens ---------- */
.stage { position: relative; flex: 1 1 auto; overflow: hidden; }
.screen {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 12px 168px;
  overscroll-behavior: contain;
}
.screen.in-fwd  { animation: inFwd .34s var(--ease) both; }
.screen.in-back { animation: inBack .34s var(--ease) both; }
.screen.out-fwd { animation: outFwd .26s var(--ease) both; pointer-events: none; }
.screen.out-back{ animation: outBack .26s var(--ease) both; pointer-events: none; }
@keyframes inFwd  { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes inBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes outFwd { to { opacity: 0; transform: translateX(-20px); } }
@keyframes outBack{ to { opacity: 0; transform: translateX(20px); } }

.eyebrow { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--accent-ink); margin-bottom: 8px; min-height: 21px; }
.chip { font-size: 12px; font-weight: 600; color: var(--fg3); background: var(--surface); padding: 2px 8px; border-radius: 6px; }
.chip.blue { color: var(--accent-ink); background: var(--accent-soft); }
.q-title { font-size: 24px; line-height: 1.42; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; word-break: keep-all; white-space: pre-line; }
.q-sub { margin: 8px 0 0; font-size: 15px; color: var(--fg3); font-weight: 500; display: flex; align-items: center; gap: 8px; word-break: keep-all; }
.count { font-variant-numeric: tabular-nums; color: var(--accent-ink); font-weight: 700; transition: transform .2s var(--ease); display: inline-block; }
.count.bump { animation: bump .25s var(--ease); }
@keyframes bump { 50% { transform: scale(1.25); } }

/* info box */
.info { margin-top: 20px; background: var(--surface); border-radius: 16px; padding: 16px; display: grid; gap: 12px; font-size: 14px; color: var(--fg2); word-break: keep-all; }
.info-row { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.info-row b { color: var(--fg); font-weight: 600; }
.ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.ico svg { width: 13px; height: 13px; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.ico.ok { background: var(--accent-soft); } .ico.ok svg { stroke: var(--accent); }
.ico.no { background: var(--surface-press); } .ico.no svg { stroke: var(--fg3); }

/* ---------- options ---------- */
.opts { margin-top: 28px; display: grid; gap: 8px; }
.opts.grid { grid-template-columns: 1fr 1fr; }
.opts.grid .opt.wide { grid-column: 1 / -1; }
.opts.shake { animation: shake .36s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

.opt {
  position: relative; width: 100%; min-height: 58px; text-align: left;
  display: flex; align-items: center; gap: 12px;
  padding: 15px 16px; border-radius: 16px; background: var(--surface);
  font-size: 17px; font-weight: 500; line-height: 1.4; color: var(--fg); word-break: keep-all;
  transition: background .18s, color .18s, transform .16s var(--ease), box-shadow .18s;
}
.opt:active { transform: scale(.975); background: var(--surface-press); }
.opt.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent); }
.opt.on:active { background: var(--accent-soft); }
.opt.ex { margin-top: 8px; }
.opts.grid .opt { min-height: 56px; padding: 14px; font-size: 16px; justify-content: center; text-align: center; }
.opts.grid .opt .mk { display: none; }
.opt .lb { flex: 1; min-width: 0; }
.opt .note { display: block; font-size: 13px; font-weight: 500; color: var(--fg3); margin-top: 2px; }
.opt.on .note { color: var(--accent-ink); opacity: .8; }

/* single: check at the right */
.mk-r { width: 24px; height: 24px; flex: 0 0 24px; }
.mk-r svg { width: 24px; height: 24px; fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .28s var(--ease); }
.opt.on .mk-r svg { stroke-dashoffset: 0; }
/* multi: round box at the left */
.mk-l { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; background: var(--surface-press); display: grid; place-items: center; transition: background .18s, transform .2s var(--ease); }
.mk-l svg { width: 14px; height: 14px; fill: none; stroke: var(--bg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.opt.on .mk-l { background: var(--accent); animation: pop .26s var(--ease); }
.opt.on .mk-l svg { stroke: var(--on-accent); opacity: 1; }
@keyframes pop { 50% { transform: scale(1.18); } }
/* rank badge */
.rk { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--surface-press); color: var(--fg3); transition: background .18s, color .18s; font-variant-numeric: tabular-nums; }
.opt.on .rk { background: var(--accent); color: var(--on-accent); animation: pop .26s var(--ease); }

/* etc text */
.etc { overflow: hidden; max-height: 0; transition: max-height .3s var(--ease), margin .3s var(--ease); }
.etc.open { max-height: 80px; margin-top: 0; }
.opts.grid .etc { grid-column: 1 / -1; }
.field {
  width: 100%; height: 54px; border-radius: 14px; border: 0; padding: 0 16px;
  background: var(--surface); color: var(--fg); font: inherit; font-size: 16px;
  box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow .18s;
}
.field:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.field::placeholder { color: var(--fg3); }

/* number input */
.num-wrap { margin-top: 40px; display: flex; align-items: baseline; gap: 10px; font-size: 32px; font-weight: 700; }
.num-wrap .pre, .num-wrap .unit { color: var(--fg); }
.num {
  width: 3.2ch; font: inherit; font-size: 32px; font-weight: 700; color: var(--fg); text-align: center;
  border: 0; background: transparent; padding: 0 0 6px; border-bottom: 2px solid var(--line); border-radius: 0;
  transition: border-color .18s; font-variant-numeric: tabular-nums; caret-color: var(--accent);
}
.num:focus { outline: none; border-color: var(--accent); }
.num::placeholder { color: var(--disabled); }
.err { min-height: 22px; margin-top: 12px; color: var(--danger); font-size: 14px; font-weight: 500; }
.num.bad { border-color: var(--danger); }

/* slider */
.pct-box { margin-top: 44px; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.pct { width: 3.4ch; text-align: right; font: inherit; font-size: 56px; font-weight: 700; letter-spacing: -0.03em; color: var(--accent); border: 0; background: transparent; padding: 0; font-variant-numeric: tabular-nums; caret-color: var(--accent); }
.pct:focus { outline: none; }
.pct::placeholder { color: var(--disabled); }
.pct-box span { font-size: 32px; font-weight: 700; color: var(--accent); }
.pct-box.idle .pct, .pct-box.idle span { color: var(--disabled); }
.rng { margin-top: 28px; width: 100%; -webkit-appearance: none; appearance: none; height: 44px; background: transparent; touch-action: pan-y; }
.rng::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(to right, var(--accent) var(--p,0%), var(--line) var(--p,0%)); }
.rng::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(to right, var(--accent) var(--p,0%), var(--line) var(--p,0%)); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2), 0 0 0 1px rgba(0,0,0,.04); transition: transform .15s var(--ease); }
.rng::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.rng:active::-webkit-slider-thumb { transform: scale(1.12); }
.rng-scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg3); font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.quick button { flex: 1 1 0; min-width: 52px; height: 42px; border-radius: 12px; background: var(--surface); font-size: 15px; font-weight: 600; color: var(--fg2); transition: transform .15s var(--ease), background .15s, color .15s; font-variant-numeric: tabular-nums; }
.quick button:active { transform: scale(.94); background: var(--surface-press); }
.quick button.on { background: var(--accent-soft); color: var(--accent-ink); }

/* textarea */
.ta { margin-top: 28px; width: 100%; min-height: 168px; resize: none; border: 0; border-radius: 16px; padding: 16px; background: var(--surface); color: var(--fg); font: inherit; font-size: 16px; line-height: 1.6; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .18s; }
.ta:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.ta::placeholder { color: var(--fg3); }
.ta-count { text-align: right; font-size: 13px; color: var(--fg3); margin-top: 8px; font-variant-numeric: tabular-nums; }

/* ---------- intro / chapter / done ---------- */
.hero-art { margin: 28px 0 28px; width: 112px; height: 112px; }
.hero-art .b { transform-origin: bottom; animation: grow .7s var(--ease) both; }
.hero-art .b2 { animation-delay: .08s; } .hero-art .b3 { animation-delay: .16s; }
.hero-art .coin { animation: drop .7s .3s var(--ease) both; }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
.big-title { font-size: 28px; line-height: 1.38; font-weight: 700; letter-spacing: -0.025em; margin: 0; white-space: pre-line; word-break: keep-all; }
.lead { margin: 12px 0 0; font-size: 16px; color: var(--fg2); word-break: keep-all; }
.facts { margin-top: 36px; display: grid; gap: 20px; }
.fact { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; }
.fact .fi { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; }
.fact .fi svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fact b { display: block; font-size: 16px; font-weight: 600; }
.fact span { font-size: 14px; color: var(--fg3); }

.steps { margin-top: 36px; display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 14px; align-items: start; position: relative; padding-bottom: 22px; }
.step:last-child { padding-bottom: 0; }
.step::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step.done::before { background: var(--accent); }
.sd { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface); color: var(--fg3); position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
.sd svg { width: 14px; height: 14px; fill: none; stroke: var(--on-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.step.done .sd { background: var(--accent); }
.step.now .sd { background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 6px var(--accent-soft); animation: pop .4s .15s var(--ease) both; }
.st b { display: block; font-size: 17px; font-weight: 600; color: var(--fg3); line-height: 28px; }
.st span { display: block; font-size: 14px; color: var(--fg3); margin-top: 0; }
.step.now .st b { color: var(--fg); }
.step.done .st b { color: var(--fg2); }

.done-mark { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; margin: 48px 0 28px; animation: pop .5s var(--ease) both; }
.done-mark svg { width: 36px; height: 36px; fill: none; stroke: var(--on-accent); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .45s .3s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done-mark { position: relative; transition: background .3s; }
.done-mark.wait { background: var(--accent-soft); }
.done-mark.wait svg, .done-mark.fail svg { display: none; }
.done-mark.wait::after { content: ""; width: 34px; height: 34px; border-radius: 50%; border: 3.5px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
.done-mark.fail { background: var(--danger); }
.done-mark.fail::after { content: "!"; color: var(--on-accent); font-size: 36px; font-weight: 700; line-height: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
/* 전송 대기: 진행 막대 + 바뀌는 문구 (중간 이탈 방지) */
.wait-box { margin-top: 32px; }
.wait-bar { height: 8px; border-radius: 99px; background: var(--surface); overflow: hidden; }
.wait-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .6s var(--ease); }
.wait-tip { margin-top: 18px; min-height: 52px; font-size: 17px; font-weight: 600; line-height: 1.5; color: var(--fg); word-break: keep-all; white-space: pre-line; transition: opacity .35s, transform .35s var(--ease); }
.wait-tip.swap { opacity: 0; transform: translateY(6px); }
.wait-note { margin-top: 20px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg2); background: var(--surface); border-radius: 14px; padding: 14px 16px; word-break: keep-all; }
.wait-note b { color: var(--fg); font-weight: 600; }
.wait-note svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 2px; fill: none; stroke: var(--fg3); stroke-width: 2; stroke-linecap: round; }
.preview-note { margin-top: 24px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg2); background: var(--surface); border-radius: 14px; padding: 14px 16px; word-break: keep-all; }
.preview-note svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 2px; fill: none; stroke: var(--fg3); stroke-width: 2; stroke-linecap: round; }
.fold { margin-top: 12px; border-radius: 16px; background: var(--surface); }
.fold summary { list-style: none; cursor: pointer; padding: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; user-select: none; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary svg { width: 20px; height: 20px; fill: none; stroke: var(--fg3); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s var(--ease); }
.fold[open] summary svg { transform: rotate(180deg); }
.ans { padding: 0 16px 8px; }
.ans-row { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; font-size: 14px; }
.ans-row .k { color: var(--fg3); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.ans-row .qq { color: var(--fg2); word-break: keep-all; }
.ans-row .vv { color: var(--fg); font-weight: 600; word-break: keep-all; }

/* ---------- footer CTA ---------- */
.cta {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-top: 28px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 26px);
  display: grid; gap: 4px; transition: transform .28s var(--ease), opacity .2s;
  will-change: transform;
}
.cta.hide { transform: translateY(110%); opacity: 0; pointer-events: none; }
.skip { height: 40px; font-size: 15px; font-weight: 500; color: var(--fg3); border-radius: 10px; justify-self: center; padding: 0 16px; transition: background .15s; }
.skip:active { background: var(--surface); }
.btn {
  height: 56px; border-radius: 16px; background: var(--accent); color: var(--on-accent);
  font-size: 17px; font-weight: 600; width: 100%;
  transition: background .18s, transform .16s var(--ease), opacity .18s;
}
.btn:active { transform: scale(.98); background: var(--accent-press); }
.btn:disabled { background: var(--disabled); color: var(--bg); cursor: default; transform: none; }
.btn.ghost { background: var(--surface); color: var(--fg2); }
.btn.ghost:active { background: var(--surface-press); }
.cta-row { display: flex; gap: 8px; }
.cta-row .btn { flex: 1 1 auto; }

function progress() {
  const bar = $('#bar'), fill = $('#barFill');
  if (cur === 'intro' || cur === 'done') { bar.classList.add('off'); return; }
  bar.classList.remove('off');
  const a = { ...ASSUME, ...A };
  const path = Q.filter(q => q.type !== 'chapter' && vis(q, a));
  let idx = path.findIndex(q => q.id === cur);
  if (idx < 0) { const n = nextId(cur); idx = Math.max(0, path.findIndex(q => q.id === n)); }
  const p = Math.round((idx / path.length) * 100);
  fill.style.width = Math.max(3, p) + '%';
  bar.setAttribute('aria-valuenow', p);
}

/* ================= 화면 전환 ================= */
function show(html, dir, after) {
  const old = stage.querySelector('.screen:not(.out-fwd):not(.out-back)');
  const el = document.createElement('section');
  el.className = 'screen ' + (dir === 'back' ? 'in-back' : dir === 'fwd' ? 'in-fwd' : '');
  el.innerHTML = html;
  stage.appendChild(el);
  lockUntil = performance.now() + 300;
  if (old) { old.classList.add(dir === 'back' ? 'out-back' : 'out-fwd'); setTimeout(() => old.remove(), 270); }
  backBtn.setAttribute('aria-hidden', cur === 'intro' || cur === 'done' ? 'true' : 'false');
  progress();
  after && after(el);
  return el;
}

function go(dir) {
  clearTimeout(advT); advT = null;
  if (dir > 0) {
    if (byId[cur] && A[cur] != null) S.delete(cur);
    if (cur !== 'intro') hist.push(cur);
    cur = cur === 'intro' ? Q.find(q => vis(q)).id : nextId(cur);
    render('fwd');
  } else {
    if (!hist.length) { cur = 'intro'; render('back'); return; }
    cur = hist.pop();
    render('back');
  }
  save();
}

function render(dir) {
  if (cur === 'intro') return renderIntro(dir);
  if (cur === 'done') return renderDone(dir);
  const q = byId[cur];
  if (q.type === 'chapter') return renderChapter(q, dir);
  renderQ(q, dir);
}

  if (q.type === 'single') return '하나만 골라 주세요';
  if (q.type === 'scale') return '가장 가까운 것을 하나 골라 주세요';
  if (q.type === 'multi') return q.max ? `최대 ${q.max}개까지 골라 주세요` : '해당하는 것을 모두 골라 주세요';
  if (q.type === 'rank') return '많이 보유한 순서대로 눌러 주세요';
  if (q.type === 'slider') return '막대를 움직이거나 숫자를 눌러 입력해 주세요';
  if (q.type === 'text') return '생각나는 대로 편하게 적어 주세요';
  return q.sub || '';
}

function head(q) {
  const chName = CH.find(c => c.key === q.ch).name;
  return `<div class="eyebrow">${q.tag ? `<span class="chip blue">${esc(q.tag)}</span>` : esc(chName)}${q.optional ? '<span class="chip">선택</span>' : ''}</div>
    <h1 class="q-title">${esc(q.title)}</h1>
    <p class="q-sub"><span>${subText(q)}</span>${(q.type === 'multi' && q.max) || q.type === 'rank' ? `<span class="count" id="cnt"></span>` : ''}</p>
    ${q.note ? `<div class="info" style="margin-top:16px"><div class="info-row"><span class="ico ok">${ICON.check}</span><div>${esc(q.note)}</div></div></div>` : ''}`;
}

function optsFor(q) {
  if (q.type !== 'rank') return q.opts;
  const src = byId[q.from];
  return (A[q.from] || []).map(v => {
    const o = src.opts.find(x => x.v === v);
    const etc = A[q.from + '_etc'];
    return { v, t: o.etc && etc ? `${o.t} (${etc})` : o.t };
  });
}

function optHTML(q, o) {
  const multi = q.type === 'multi', rank = q.type === 'rank';
  const role = multi || rank ? 'checkbox' : 'radio';
  const wide = q.grid && o.etc && optsFor(q).length % 2 ? ' wide' : '';
  const lead = multi ? `<span class="mk mk-l">${ICON.check}</span>` : rank ? `<span class="rk"></span>` : '';
  const tail = !multi && !rank ? `<span class="mk mk-r">${ICON.check}</span>` : '';
  const ex = o.ex && !q.grid ? ' ex' : '';
  return `<button class="opt${ex}${wide}" role="${role}" aria-checked="false" data-v="${o.v}">${lead}<span class="lb">${esc(o.t)}${o.n ? `<span class="note">${esc(o.n)}</span>` : ''}</span>${tail}</button>` +
    (o.etc ? `<div class="etc" data-for="${o.v}"><input class="field" id="etc-${q.id}" maxlength="60" placeholder="직접 입력해 주세요" autocomplete="off"></div>` : '');
}

function renderQ(q, dir) {
  if (q.type === 'rank' && A[q.id]) { const ok = A[q.from] || []; A[q.id] = A[q.id].filter(v => ok.includes(v)); if (!A[q.id].length) delete A[q.id]; }
  let body = '';
  if (['single', 'multi', 'scale', 'rank'].includes(q.type)) {
    body = `<div class="opts${q.grid ? ' grid' : ''}" id="opts" role="${q.type === 'multi' || q.type === 'rank' ? 'group' : 'radiogroup'}">${optsFor(q).map(o => optHTML(q, o)).join('')}</div>`;
  } else if (q.type === 'number') {
    body = `<div class="num-wrap"><span class="pre">${q.pre}</span><input class="num" id="num-${q.id}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="00" autocomplete="off" aria-label="${esc(q.title)}"><span class="unit">${q.unit}</span></div><div class="err" id="err"></div>`;
  } else if (q.type === 'slider') {
    body = `<div class="pct-box idle" id="pctBox"><input class="pct" id="pct-${q.id}" type="text" inputmode="numeric" maxlength="3" placeholder="0" aria-label="투자상품 비중(%)"><span>%</span></div>
      <input class="rng" id="rng-${q.id}" type="range" min="0" max="100" step="1" value="0" aria-label="투자상품 비중 슬라이더">
      <div class="rng-scale"><span>0%</span><span>50%</span><span>100%</span></div>
      <div class="quick" id="quick">${[10, 30, 50, 70, 100].map(v => `<button data-q="${v}">${v}%</button>`).join('')}</div>`;
  } else if (q.type === 'text') {
    body = `<textarea class="ta" id="ta-${q.id}" maxlength="500" placeholder="예) 여러 금융사의 연금을 한 번에 관리해 주는 기능"></textarea><div class="ta-count"><span id="taN">0</span>/500</div>`;
  }
  const info = q.info ? `<div class="info">
      <div class="info-row"><span class="ico ok">${ICON.check}</span><div>본인 명의로 모든 금융기관에 보유한 금액을 모두 합한 것이에요</div></div>
      <div class="info-row"><span class="ico ok">${ICON.check}</span><div><b>포함</b> · 예·적금, CMA·파킹통장, 주식, 펀드, ETF, 채권, 연금저축·IRP·ISA, 저축성 보험</div></div>
      <div class="info-row"><span class="ico no">${ICON.x}</span><div><b>제외</b> · 부동산, 전·월세 보증금, 보장성 보험, 가상자산</div></div>
    </div>` : '';
  const el = show(head(q) + info + body, dir);
  bindQ(q, el);
}

function bindQ(q, el) {
  const isLast = nextId(q.id) === 'done';
  const label = isLast ? '제출하기' : '다음';
  const common = { label, onSkip: () => { delete A[q.id]; delete A[q.id + '_etc']; S.add(q.id); go(1); }, skip: q.optional ? '건너뛰기' : null };

  if (['single', 'scale', 'multi', 'rank'].includes(q.type)) {
    const box = el.querySelector('#opts');
    const btns = [...box.querySelectorAll('.opt')];
    const etcInput = el.querySelector('.etc input');
    const etcOpt = q.type !== 'rank' ? q.opts.find(o => o.etc) : null;
    if (etcInput) {
      etcInput.value = A[q.id + '_etc'] || '';
      etcInput.addEventListener('input', () => { A[q.id + '_etc'] = etcInput.value.trim(); save(); });
      etcInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); etcInput.blur(); if (!nextBtn.disabled) nextBtn.click(); } });
    }
    const revisit = A[q.id] != null;
    const sel = () => { const v = A[q.id]; return v == null ? [] : Array.isArray(v) ? v : [v]; };
    const paint = (bump) => {
      const s = sel();
      btns.forEach(b => {
        const v = +b.dataset.v, on = s.includes(v);
        b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
        if (q.type === 'rank') b.querySelector('.rk').textContent = on ? s.indexOf(v) + 1 : '';
      });
      if (etcOpt) {
        const open = s.includes(etcOpt.v);
        el.querySelector('.etc').classList.toggle('open', open);
        if (!open) delete A[q.id + '_etc'];
      }
      const cnt = el.querySelector('#cnt');
      const lim = q.type === 'rank' ? Math.min(3, btns.length) : q.max;
      if (cnt) { cnt.textContent = `${s.length}/${lim}`; if (bump) { cnt.classList.remove('bump'); void cnt.offsetWidth; cnt.classList.add('bump'); } }
      const single = q.type === 'single' || q.type === 'scale';
      setCTA({ ...common, enabled: s.length > 0,
        visible: !single || revisit || q.optional || (etcOpt && s.includes(etcOpt.v)),
        onNext: () => go(1) });
    };
    const shake = () => { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); buzz([12, 40, 12]); };
    btns.forEach(b => b.addEventListener('click', () => {
      const v = +b.dataset.v;
      const o = (q.type === 'rank' ? optsFor(q) : q.opts).find(x => x.v === v);
      if (q.type === 'single' || q.type === 'scale') {
        const same = A[q.id] === v;
        A[q.id] = v; buzz(); paint(); save();
        if (o.etc) { setTimeout(() => etcInput && etcInput.focus(), 120); return; }
        clearTimeout(advT); advT = setTimeout(() => go(1), same ? 120 : 300);
        return;
      }
      let s = sel().slice();
      if (s.includes(v)) s = s.filter(x => x !== v);
      else if (o.ex) s = [v];
      else {
        s = s.filter(x => !(q.type !== 'rank' && q.opts.find(y => y.v === x).ex));
        const lim = q.type === 'rank' ? 3 : q.max;
        if (lim && s.length >= lim) { shake(); toast(q.type === 'rank' ? '3개까지 고를 수 있어요. 순위를 바꾸려면 다시 눌러 주세요' : `최대 ${lim}개까지 고를 수 있어요`); return; }
        s.push(v);
      }
      if (q.type === 'multi') s.sort((a, b) => a - b);
      if (s.length) A[q.id] = s; else delete A[q.id];
      buzz(); paint(true); save();
      if (o.etc && s.includes(v)) setTimeout(() => etcInput && etcInput.focus(), 150);
    }));
    paint();
    return;
  }

  if (q.type === 'number') {
    const inp = el.querySelector('.num'), err = el.querySelector('#err');
    if (A[q.id] != null) inp.value = A[q.id];
    const check = (final) => {
      inp.value = inp.value.replace(/\D/g, '');
      const n = +inp.value, ok = inp.value !== '' && n >= q.min && n <= q.max;
      const msg = inp.value && (final || inp.value.length >= 2) && !ok ? `${q.min}세에서 ${q.max}세 사이로 입력해 주세요` : '';
      err.textContent = msg; inp.classList.toggle('bad', !!msg);
      if (ok) A[q.id] = n; else delete A[q.id];
      setCTA({ ...common, enabled: ok, visible: true, onNext: () => { if (A[q.id] != null) go(1); } });
    };
    inp.addEventListener('input', () => { check(false); save(); });
    inp.addEventListener('blur', () => check(true));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !nextBtn.disabled) nextBtn.click(); });
    check(false);
    setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 360);
    return;
  }

  if (q.type === 'slider') {
    const rng = el.querySelector('.rng'), pct = el.querySelector('.pct'), boxEl = el.querySelector('#pctBox'), quick = [...el.querySelectorAll('#quick button')];
    let lastTick = -1;
    const set = (n, from) => {
      n = Math.max(0, Math.min(100, Math.round(n)));
      A[q.id] = n; boxEl.classList.remove('idle');
      if (from !== 'rng') rng.value = n;
      if (from !== 'pct') pct.value = n;
      rng.style.setProperty('--p', n + '%');
      quick.forEach(b => b.classList.toggle('on', +b.dataset.q === n));
      const tick = Math.floor(n / 10); if (tick !== lastTick) { if (lastTick >= 0) buzz(4); lastTick = tick; }
      setCTA({ ...common, enabled: true, visible: true, onNext: () => go(1) });
      save();
    };
    rng.addEventListener('input', () => set(+rng.value, 'rng'));
    pct.addEventListener('input', () => { pct.value = pct.value.replace(/\D/g, '').slice(0, 3); if (pct.value === '') return; set(+pct.value, 'pct'); });
    pct.addEventListener('blur', () => { if (A[q.id] != null) pct.value = A[q.id]; });
    pct.addEventListener('keydown', e => { if (e.key === 'Enter') pct.blur(); });
    quick.forEach(b => b.addEventListener('click', () => { buzz(); set(+b.dataset.q); }));
    if (A[q.id] != null) set(A[q.id]);
    else setCTA({ ...common, enabled: false, visible: true, onNext: () => go(1) });
    return;
  }

  if (q.type === 'text') {
    const ta = el.querySelector('.ta'), n = el.querySelector('#taN');
    ta.value = A[q.id] || ''; n.textContent = ta.value.length;
    ta.addEventListener('input', () => { n.textContent = ta.value.length; if (ta.value.trim()) A[q.id] = ta.value.trim(); else delete A[q.id]; save(); });
    setCTA({ ...common, skip: null, enabled: true, visible: true, onNext: () => go(1) });
  }
}

/* ================= 완료 ================= */
function fmt(q, v) {
  if (q.type === 'number') return `만 ${v}세`;
  if (q.type === 'slider') return `${v}%`;
  if (q.type === 'text') return v;
  const os = q.type === 'rank' ? byId[q.from].opts : q.opts;
  const etc = A[(q.type === 'rank' ? q.from : q.id) + '_etc'];
  const lab = c => { const o = os.find(x => x.v === c); return o ? (o.etc && etc ? `${o.t} (${etc})` : o.t) : c; };
  if (q.type === 'rank') return v.map((c, i) => `${i + 1}순위 ${lab(c)}`).join(' · ');
  return (Array.isArray(v) ? v : [v]).map(lab).join(', ');
}

/* ================= 시트 저장용 레코드 =================
   열 이름 = 엑셀 시트 번호 + 문항 번호 (예: 1번_Q5_3). 미노출 = 빈칸, 건너뜀 = -9, 복수 선택 = 보기별 1/0 */
const SKIP = -9;
const colKey = q => q.code;
const WHEN = {
  A4: 'A3 = 2~5 (자녀 있음)',
  I2: 'Q1-1 = 1 (현재 투자자)', I3: 'Q1-1 = 1 (현재 투자자)', P32: 'Q1-1 = 1, Q3-1을 2개 이상 선택 (1개면 그 상품이 1순위로 자동 기록)',
  P51a: 'Q5-1 = 2', P52: 'Q5-1 = 1', P53: 'Q5-1 = 1', P54: 'Q5-1 = 1', P65a: 'Q6-5 = 2',
  N21: 'Q1-1 = 2 (과거 투자자)', N22: 'Q1-1 = 3 (투자 미경험자)', N62a: 'Q6′-2 = 2·3·4',
};
const whenOf = q => WHEN[q.id] || (/^P/.test(q.id) ? 'Q1-1 = 1 (현재 투자자)' : /^N/.test(q.id) ? 'Q1-1 = 2·3 (비투자자)' : '전원');
const TYPE_KO = { single: '단일 선택', scale: '5점 척도', multi: '복수 선택', rank: '순위', number: '숫자', slider: '비율(%)', text: '자유 응답' };

function buildRecord() {
  const path = Q.filter(q => q.type !== 'chapter' && vis(q));
  const shown = new Set(path.map(q => q.id));
  const code = { cols: [], row: {} }, label = { cols: [], row: {} }, book = [];
  const put = (t, k, v) => { t.cols.push(k); if (v !== undefined && v !== null && v !== '') t.row[k] = v; };
  const both = (k, v, lv) => { put(code, k, v); put(label, k, lv === undefined ? v : lv); };
  const now = new Date();
  const metaCols = [
    ['응답ID', meta.rid], ['접수시각', ''], ['시작시각', meta.started], ['제출시각(기기)', now.toISOString()],
    ['소요시간(초)', Math.round((now - new Date(meta.started)) / 1000)], ['설문버전', VERSION],
  ];
  metaCols.forEach(([k, v]) => both(k, v));
  book.push({ col: '응답ID·접수시각 등', q: '응답 정보', type: '메타', values: '접수시각은 서버(구글) 기준', when: '전원' });

  Q.filter(q => q.type !== 'chapter').forEach(q => {
    const k = colKey(q), on = shown.has(q.id), v = A[q.id], sk = on && v == null && S.has(q.id);
    const title = q.title.replace(/\n/g, ' '), when = whenOf(q), type = TYPE_KO[q.type];
    const etcOpt = q.opts && q.opts.find(o => o.etc);
    const etcTxt = on ? A[q.id + '_etc'] : '';
    const lab = c => { const o = q.opts.find(x => x.v === c); return o ? o.t : c; };
    if (q.type === 'single' || q.type === 'scale') {
      both(k, on ? (v != null ? v : sk ? SKIP : '') : '', on ? (v != null ? lab(v) : sk ? '(건너뜀)' : '') : '');
      book.push({ col: k, q: title, type, values: q.opts.map(o => `${o.v}=${o.t}`).join(' / ') + (q.optional ? ' / -9=건너뜀' : ''), when });
    } else if (q.type === 'multi') {
      const sel = Array.isArray(v) ? v : [];
      q.opts.forEach(o => {
        const ck = `${k}_${o.v}`;
        put(code, ck, on ? (sel.includes(o.v) ? 1 : sk ? SKIP : 0) : '');
        book.push({ col: ck, q: title, type: q.max ? `${type} (최대 ${q.max}개)` : type, values: `${o.t} → 1=선택, 0=미선택${q.optional ? ', -9=건너뜀' : ''}${o.ex ? ' (단독 선택)' : ''}`, when });
      });
      put(label, k, on ? (sel.length ? sel.map(lab).join(', ') : sk ? '(건너뜀)' : '') : '');
    } else if (q.type === 'rank') {
      let r = Array.isArray(v) ? v : [];
      const src = A[q.from] || [];
      if (!on && A.I1 === 1 && src.length === 1) r = [src[0]];
      const srcQ = byId[q.from];
      [1, 2, 3].forEach(i => {
        const c = r[i - 1];
        put(code, `${k}_${i}순위`, c != null ? c : '');
        put(label, `${k}_${i}순위`, c != null ? (srcQ.opts.find(o => o.v === c) || {}).t : '');
        book.push({ col: `${k}_${i}순위`, q: title, type, values: `${i}순위 상품 코드 (2번_Q3-1 보기 번호)`, when });
      });
    } else if (q.type === 'number') {
      both(k, on ? (v != null ? v : '') : '');
      book.push({ col: k, q: title, type, values: `${q.min}~${q.max} (세)`, when });
    } else if (q.type === 'slider') {
      both(k, on ? (v != null ? v : '') : '');
      book.push({ col: k, q: title, type, values: '0~100 (%)', when });
    } else if (q.type === 'text') {
      both(k, on ? (v || '') : '');
      book.push({ col: k, q: title, type, values: '자유 텍스트 (최대 500자)', when });
    }
    if (etcOpt) {
      both(`${k}_기타`, etcTxt || '');
      book.push({ col: `${k}_기타`, q: title, type: '기타 직접 입력', values: `"${etcOpt.t}" 선택 시 입력한 내용`, when });
    }
  });
  const qs = Q.filter(q => q.type !== 'chapter').map(q => ({ code: q.code, title: q.title.replace(/\n/g, ' '), type: q.type,
    opts: q.type === 'rank' ? byId[q.from].opts.map(o => ({ v: o.v, t: o.t })) : (q.opts || []).map(o => ({ v: o.v, t: o.t })) }));
  return { rid: meta.rid, version: VERSION, code, label, book, qs, raw: JSON.stringify({ answers: A, skipped: [...S] }) };
}

/* ================= 전송 (재시도 + 기기에 임시 보관) ================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pendingGet = () => { try { return JSON.parse(localStorage.getItem(PENDING) || '[]'); } catch (e) { return []; } };
const pendingSet = list => { try { list.length ? localStorage.setItem(PENDING, JSON.stringify(list)) : localStorage.removeItem(PENDING); } catch (e) {} };
/* 전송 경로 2개: ① google.script.run  ② 웹 앱 주소로 직접 POST(doPost). 번갈아 시도하고, 서버는 응답ID로 중복을 막는다. */
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbySWUhgSmHaYpYazKjyQ7DJm7l8rVdMe17ozOLpRa0mqhkuaYWLJuQHGCcQnZnmAIBX/exec';
function viaRun(payload) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('timeout')), 75000);
    google.script.run
      .withSuccessHandler(r => { clearTimeout(t); r && r.ok ? res(r) : rej(new Error('rejected')); })
      .withFailureHandler(e => { clearTimeout(t); rej(e); })
      .submit(payload);
  });
}
async function viaPost(payload) {
  if (!/^https:\/\//.test(EXEC_URL)) throw new Error('no url');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 75000);
  try {
    const r = await fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow', credentials: 'omit', cache: 'no-store', signal: ctl.signal });
    const j = await r.json();
    if (!j || !j.ok) throw new Error('rejected');
    return j;
  } finally { clearTimeout(t); }
}
async function sendWithRetry(payload) {
  const waits = [1000, 2500, 5000, 9000, 15000];
  for (let i = 0; i <= waits.length; i++) {
    try { await (!HAS_RUN() ? viaPost(payload) : i % 2 === 0 ? viaRun(payload) : viaPost(payload).catch(() => viaRun(payload))); return true; }
    catch (e) { if (i < waits.length) await sleep(waits[i] * (0.75 + Math.random() * 0.5)); }
  }
  return false;
}
async function flushPending() {
  if (!LIVE()) return;
  for (const p of pendingGet()) {
    if (await sendWithRetry(p)) pendingSet(pendingGet().filter(x => x.rid !== p.rid));
  }
}

/* 전송 대기 문구: 2.6초마다 바뀌고, 12초가 넘으면 '느린 연결' 안내로 고정 */
const WAIT_LEAD = '마지막까지 와 주셔서 감사해요. 조금만 더 기다려 주세요.';
const WAIT_TIPS = [
  '답변을 하나씩 꼼꼼히 담고 있어요',
  '여기까지 오신 것만으로도 큰 도움이에요',
  '보내 주신 응답은 연구에 소중히 쓰여요',
  '조금만 힘내 주세요, 거의 다 왔어요',
  '구글 시트에 안전하게 기록하는 중이에요',
  '마지막 확인만 남았어요',
];
const WAIT_SLOW = '인터넷이 조금 느린 것 같아요.\n계속 보내고 있으니 창을 닫지 말아 주세요.';
window.addEventListener('beforeunload', e => { if (sendState === 'sending') { e.preventDefault(); e.returnValue = ''; } }); // 보내는 중 나가려 하면 브라우저가 한 번 묻도록

function renderDone(dir) {
  // 최종 경로에서 보이지 않는 문항의 응답은 정리
  const path = Q.filter(q => q.type !== 'chapter' && vis(q));
  const keep = new Set(path.flatMap(q => [q.id, q.id + '_etc']));
  Object.keys(A).forEach(k => { if (!keep.has(k)) delete A[k]; });
  S.forEach(id => { if (!keep.has(id) || A[id] != null) S.delete(id); });
  if (!meta) meta = newMeta();
  const payload = buildRecord();
  window.__surveyResult = { ...A };
  window.__surveyPayload = payload;
  const live = LIVE();
  if (live) { pendingSet([...pendingGet().filter(p => p.rid !== payload.rid), payload]); }
  clear();
  const rows = path.filter(q => A[q.id] != null).map(q => `<div class="ans-row"><span class="k">${esc(colKey(q))}</span><span class="qq">${esc(q.title.replace(/\n/g, ' '))}</span><span class="vv">${esc(fmt(q, A[q.id]))}</span></div>`).join('');
  const el = show(`
    <div class="done-mark ${live ? 'wait' : ''}" id="dm">${ICON.check}</div>
    <h1 class="big-title" id="dt">${live ? '응답을 보내고 있어요' : '소중한 응답\n감사합니다'}</h1>
    <p class="lead" id="dl">${live ? WAIT_LEAD : '설문이 모두 끝났어요. 응답은 통계 목적으로만 사용되고, 개인을 식별하지 않아요.'}</p>
    ${live ? `<div class="wait-box" id="wb"><div class="wait-bar"><i id="wbar"></i></div><p class="wait-tip" id="wtip">${WAIT_TIPS[0]}</p>
    <div class="wait-note">${ICON.info}<span><b>보통 5초, 느리면 10초까지 걸려요.</b> 지금 창을 닫거나 나가시면 응답이 전달되지 않을 수 있어요.</span></div></div>` : ''}
    ${live ? '' : `<div class="preview-note">${ICON.info}<span>미리보기 버전이에요. 구글 시트에 연결된 주소에서 열면 응답이 시트로 저장돼요.</span></div>
    <details class="fold"><summary>내 응답 확인하기 <span style="display:flex;align-items:center;gap:6px;color:var(--fg3);font-weight:500;font-size:14px">${path.filter(q => A[q.id] != null).length}문항 ${ICON.down}</span></summary><div class="ans">${rows}</div></details>`}`, dir);
  backBtn.setAttribute('aria-hidden', 'true');
  const restart = () => { A = {}; hist = []; S = new Set(); meta = null; cur = 'intro'; render('back'); };
  if (!live) { setCTA({ label: '처음부터 다시 하기', enabled: true, visible: true, ghost: true, onNext: restart }); return; }

  const dm = el.querySelector('#dm'), dt = el.querySelector('#dt'), dl = el.querySelector('#dl');
  const wb = el.querySelector('#wb'), wbar = el.querySelector('#wbar'), wtip = el.querySelector('#wtip');
  let waitT = null;
  const stopWait = () => { clearInterval(waitT); waitT = null; };
  const startWait = () => {
    stopWait();
    const t0 = Date.now(); let n = 0, slow = false;
    wb.hidden = false; wbar.style.width = '4%'; wtip.textContent = WAIT_TIPS[0]; wtip.classList.remove('swap');
    const swap = txt => { wtip.classList.add('swap'); setTimeout(() => { wtip.textContent = txt; wtip.classList.remove('swap'); }, 350); };
    waitT = setInterval(() => {
      if (!el.isConnected) return stopWait();
      const sec = (Date.now() - t0) / 1000;
      wbar.style.width = Math.min(94, 4 + 90 * (1 - Math.exp(-sec / 4.5))).toFixed(1) + '%'; // 처음엔 빠르게, 10초쯤 거의 끝까지
      if (sec >= 12 && !slow) { slow = true; swap(WAIT_SLOW); return; }
      if (!slow && sec >= (n + 1) * 2.6 && n < WAIT_TIPS.length - 1) swap(WAIT_TIPS[++n]);
    }, 200);
  };
  const attempt = async () => {
    sendState = 'sending';
    dm.className = 'done-mark wait'; dt.textContent = '응답을 보내고 있어요'; dl.textContent = WAIT_LEAD;
    setCTA({ label: '보내는 중', enabled: false, visible: false });
    startWait();
    const ok = await sendWithRetry(payload);
    stopWait();
    if (!el.isConnected) return;
    if (ok) wbar.style.width = '100%';
    wb.hidden = true;
    if (ok) {
      sendState = 'ok';
      pendingSet(pendingGet().filter(p => p.rid !== payload.rid));
      dm.className = 'done-mark'; dt.textContent = '소중한 응답\n감사합니다'; dl.textContent = '응답이 잘 전달됐어요. 이제 창을 닫으셔도 돼요.';
      setCTA({ label: '완료', enabled: false, visible: false });
    } else {
      sendState = 'fail';
      dm.className = 'done-mark fail'; dt.textContent = '응답을 아직\n보내지 못했어요'; dl.textContent = '인터넷 연결을 확인하고 다시 보내 주세요. 응답은 이 기기에 보관돼 있어서 다시 입력하지 않아도 돼요.';
      setCTA({ label: '다시 보내기', enabled: true, visible: true, onNext: attempt });
    }
    window.__sendState = sendState;
  };
  attempt();
}

/* ================= CTA / 토스트 ================= */
let onNext = null, onSkip = null;
function setCTA({ label, enabled, visible, skip, onNext: n, onSkip: s, ghost }) {
  nextBtn.textContent = label; nextBtn.disabled = !enabled;
  nextBtn.classList.toggle('ghost', !!ghost);
  // 문항 화면에서는 아래 버튼 줄(이전 · 다음)을 항상 보여 줌 (하나만 고르는 문항은 고르면 자동으로 넘어감)
  const onQ = cur !== 'intro' && cur !== 'done';
  prevBtn.hidden = !onQ;
  cta.classList.toggle('hide', !(visible || onQ));
  skipBtn.hidden = !skip; if (skip) skipBtn.textContent = skip;
  onNext = n; onSkip = s;
}
nextBtn.addEventListener('click', () => { if (!nextBtn.disabled && onNext) { buzz(); onNext(); } });
skipBtn.addEventListener('click', () => { onSkip && onSkip(); });
backBtn.addEventListener('click', () => { buzz(); go(-1); });
prevBtn.addEventListener('click', () => { buzz(); go(-1); });

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* 키보드가 올라오면 CTA를 키보드 위로 */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    cta.style.transform = kb > 80 ? `translateY(${-kb}px)` : '';
    cta.classList.toggle('kb', kb > 80);
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
}

/* 왼쪽 가장자리에서 오른쪽으로 밀면 이전 문항 */
let sx = null, sy = 0;
stage.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX - stage.getBoundingClientRect().left < 28 ? t.clientX : null; sy = t.clientY; }, { passive: true });
stage.addEventListener('touchend', e => { if (sx == null) return; const t = e.changedTouches[0]; if (t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 60 && cur !== 'intro' && cur !== 'done') go(-1); sx = null; }, { passive: true });

/* 화면이 바뀌는 0.3초 동안은 터치를 무시 (연타 시 다음 화면 보기가 눌리는 것 방지) */
document.getElementById('app').addEventListener('click', e => {
  if (performance.now() < lockUntil && e.target.closest('.opt, .btn, .skip, .back, #quick button')) { e.stopPropagation(); e.preventDefault(); }
}, true);

window.__survey = { Q, get answers() { return A; }, buildRecord, get busy() { return performance.now() < lockUntil || advT !== null; } };
render();
flushPending();
})();
</script>

</body></html>
